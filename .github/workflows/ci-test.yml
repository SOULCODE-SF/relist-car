          LITELLM_BASE_URL_VAL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY_VAL: ${{ secrets.LITELLM_MASTER_KEY }}
          AI_DAILY_REQUEST_LIMIT_VAL: ${{ secrets.AI_DAILY_REQUEST_LIMIT }}
          SEED_OWNER_EMAIL_VAL: ${{ secrets.SEED_OWNER_EMAIL }}
          SEED_OWNER_PASSWORD_VAL: ${{ secrets.SEED_OWNER_PASSWORD }}
          MIDTRANS_IS_PRODUCTION_VAL: ${{ secrets.MIDTRANS_IS_PRODUCTION }}
          MIDTRANS_PRODUCTION_VAL: ${{ secrets.MIDTRANS_PRODUCTION }}
          URL_LOCAL_VAL: ${{ secrets.URL_LOCAL }}
          NEXTAUTH_SECRET_SANDBOX_VAL: ${{ secrets.NEXTAUTH_SECRET_SANDBOX }}
          NEXTAUTH_URL_VAL: ${{ secrets.NEXTAUTH_URL }}
