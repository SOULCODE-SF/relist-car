          DB_PORT_VAL: ${{ secrets.DB_PORT }}
          GCP_SA_KEY_VAL: ${{ secrets.GCP_SA_KEY }}
          JWT_EXPIRY_VAL: ${{ secrets.JWT_EXPIRY }}
        run: |
          echo "DB_HOST=" $(echo "${DB_HOST_VAL}" | base64)
          echo "DB_NAME=" $(echo "${DB_NAME_VAL}" | base64)
