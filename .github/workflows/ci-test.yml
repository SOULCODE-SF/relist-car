          echo "CLOUD_CORS_ORIGINS=" $(echo "${CLOUD_CORS_ORIGINS_VAL}" | base64)
          echo "LITELLM_BASE_URL=" $(echo "${LITELLM_BASE_URL_VAL}" | base64)
          echo "LITELLM_MASTER_KEY=" $(echo "${LITELLM_MASTER_KEY_VAL}" | base64)
          echo "AI_DAILY_REQUEST_LIMIT=" $(echo "${AI_DAILY_REQUEST_LIMIT_VAL}" | base64)
          echo "SEED_OWNER_EMAIL=" $(echo "${SEED_OWNER_EMAIL_VAL}" | base64)
