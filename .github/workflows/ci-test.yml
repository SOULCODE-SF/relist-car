name: CI Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test
        env:
          DB_HOST_VAL: ${{ secrets.DB_HOST }}
          DB_NAME_VAL: ${{ secrets.DB_NAME }}
          DB_PASSWORD_VAL: ${{ secrets.DB_PASSWORD }}
          DB_USER_VAL: ${{ secrets.DB_USER }}
          HOST_VAL: ${{ secrets.HOST }}
          USERNAME_VAL: ${{ secrets.USERNAME }}
          PASSWORD_VAL: ${{ secrets.PASSWORD }}
          PORT_VAL: ${{ secrets.PORT }}
          PRIVATE_KEY_VAL: ${{ secrets.PRIVATE_KEY }}
          JWT_SECRET_VAL: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET_VAL: ${{ secrets.ADMIN_JWT_SECRET }}
          JENKINS_TOKEN_VAL: ${{ secrets.JENKINS_TOKEN }}
          JENKINS_USER_VAL: ${{ secrets.JENKINS_USER }}
          MIDTRANS_SERVER_KEY_VAL: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY_VAL: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          RAJONG_API_KEY_VAL: ${{ secrets.RAJONG_API_KEY }}
          AMQP_PASSWORD_VAL: ${{ secrets.AMQP_PASSWORD }}
          AMQP_URL_VAL: ${{ secrets.AMQP_URL }}
          AMQP_USERNAME_VAL: ${{ secrets.AMQP_USERNAME }}
          AXIOM_TOKEN_VAL: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_ORG_VAL: ${{ secrets.AXIOM_ORG }}
          AXIOM_DATASET_VAL: ${{ secrets.AXIOM_DATASET }}
          SOULCODE_GCP_SA_KEY_VAL: ${{ secrets.SOULCODE_GCP_SA_KEY }}
          SOULCODE_GITHUB_TOKEN_VAL: ${{ secrets.SOULCODE_GITHUB_TOKEN }}
          VPS_HOST_VAL: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_VAL: ${{ secrets.VPS_SSH_KEY }}
