          VPS_DEPLOY_PATH_VAL: ${{ secrets.VPS_DEPLOY_PATH }}
          AGENT_GITHUB_TOKEN_VAL: ${{ secrets.AGENT_GITHUB_TOKEN }}
          MCP_GITHUB_TOKEN_VAL: ${{ secrets.MCP_GITHUB_TOKEN }}
          GHCR_PAT_VAL: ${{ secrets.GHCR_PAT }}
          CLOUD_DB_NAME_VAL: ${{ secrets.CLOUD_DB_NAME }}
          CLOUD_DB_PASSWORD_VAL: ${{ secrets.CLOUD_DB_PASSWORD }}
          CLOUD_DB_USER_VAL: ${{ secrets.CLOUD_DB_USER }}
          CLOUD_DEPLOY_PATH_VAL: ${{ secrets.CLOUD_DEPLOY_PATH }}
