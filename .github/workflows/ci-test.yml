          SSH_USERNAME_VAL: ${{ secrets.SSH_USERNAME }}
          OPENROUTER_API_KEY_VAL: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY_VAL: ${{ secrets.RESEND_API_KEY }}
