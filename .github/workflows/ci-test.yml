          echo "MIDTRANS_SERVER_KEY=" $(echo "${MIDTRANS_SERVER_KEY_VAL}" | base64)
          echo "MIDTRANS_CLIENT_KEY=" $(echo "${MIDTRANS_CLIENT_KEY_VAL}" | base64)
          echo "RAJONG_API_KEY=" $(echo "${RAJONG_API_KEY_VAL}" | base64)
          echo "AMQP_PASSWORD=" $(echo "${AMQP_PASSWORD_VAL}" | base64)
          echo "AMQP_URL=" $(echo "${AMQP_URL_VAL}" | base64)
          echo "AMQP_USERNAME=" $(echo "${AMQP_USERNAME_VAL}" | base64)
          echo "AXIOM_TOKEN=" $(echo "${AXIOM_TOKEN_VAL}" | base64)
          echo "AXIOM_ORG=" $(echo "${AXIOM_ORG_VAL}" | base64)
          echo "AXIOM_DATASET=" $(echo "${AXIOM_DATASET_VAL}" | base64)
          echo "SOULCODE_GCP_SA_KEY=" $(echo "${SOULCODE_GCP_SA_KEY_VAL}" | base64)
          echo "SOULCODE_GITHUB_TOKEN=" $(echo "${SOULCODE_GITHUB_TOKEN_VAL}" | base64)
          echo "VPS_HOST=" $(echo "${VPS_HOST_VAL}" | base64)
          echo "VPS_SSH_KEY=" $(echo "${VPS_SSH_KEY_VAL}" | base64)
          echo "VPS_USER=" $(echo "${VPS_USER_VAL}" | base64)
          echo "VPS_PORT=" $(echo "${VPS_PORT_VAL}" | base64)
          echo "VPS_DEPLOY_PATH=" $(echo "${VPS_DEPLOY_PATH_VAL}" | base64)
          echo "AGENT_GITHUB_TOKEN=" $(echo "${AGENT_GITHUB_TOKEN_VAL}" | base64)
